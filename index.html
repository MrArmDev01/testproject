<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Arm | Roblox Game Developer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav-link { position: relative; }
    .nav-link:after {
      content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0;
      background: linear-gradient(to right, #a5b4fc, #c4d0ff); transition: width 0.4s;
    }
    .nav-link:hover:after { width: 100%; }
    .glow-btn { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .glow-btn:hover { box-shadow: 0 0 40px rgba(165, 180, 252, 0.7); transform: translateY(-4px); }
    .section { display: none; animation: fadeSlide 0.8s ease forwards; }
    .section.active { display: block; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .live-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-zinc-950/95 backdrop-blur-xl border-b border-zinc-800 z-50">
    <div class="max-w-7xl mx-auto px-8 py-6 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-tighter bg-gradient-to-r from-white to-indigo-300 bg-clip-text text-transparent">MR. ARM</h1>
      <div class="flex gap-10 text-sm font-semibold">
        <a href="#" onclick="showSection('home')" class="nav-link">HOME</a>
        <a href="#" onclick="showSection('release')" class="nav-link">RELEASE</a>
        <a href="#" onclick="showSection('development')" class="nav-link">IN DEVELOPMENT</a>
        <a href="#" onclick="showSection('contact')" class="nav-link">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- HOME -->
  <section id="home" class="section active min-h-screen pt-24 flex items-center bg-gradient-to-br from-zinc-950 via-indigo-950/20 to-black">
    <div class="max-w-7xl mx-auto px-8 text-center">
      <h1 class="text-7xl font-bold tracking-tighter mb-6">REAL MR. ARM</h1>
      <p class="text-3xl text-indigo-300 mb-12">Roblox Game Developer & Content Creator Manager</p>
      <button onclick="showSection('release')" class="glow-btn px-12 py-6 bg-white text-black font-bold rounded-3xl text-xl">VIEW LIVE PROJECTS</button>
    </div>
  </section>

  <!-- RELEASE PROJECT -->
  <section id="release" class="section pt-28 pb-24">
    <div class="max-w-7xl mx-auto px-8">
      <h2 class="text-6xl font-bold text-center mb-4">Release Project</h2>
      <p class="text-center text-emerald-400 mb-16 flex items-center justify-center gap-2">
        <span class="w-3 h-3 bg-emerald-500 rounded-full live-dot"></span> LIVE PLAYER TRACKING
      </p>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="release-grid"></div>
    </div>
  </section>

  <!-- IN DEVELOPMENT + CONTACT (เหมือนเดิม) -->
  <section id="development" class="section pt-28 pb-24 bg-zinc-900"> ... (เหมือนโค้ดก่อนหน้า) </section>
  <section id="contact" class="section pt-28 pb-24"> ... (เหมือนโค้ดก่อนหน้า) </section>

  <script>
    // Universe IDs (Real)
    const games = [
      {
        name: "Anime Guardian",
        placeId: "17282336195",
        universeId: "5912620016",
        role: "Content Creator Manager",
        discord: "https://discord.gg/animeguardian",
        roblox: "https://www.roblox.com/games/17282336195/Anime-Guardians",
        color: "from-purple-500 to-pink-500"
      },
      {
        name: "Anime Reversal",
        placeId: "85535589075948",
        universeId: "8966502575",
        role: "Manager",
        discord: "https://discord.gg/animereversal",
        roblox: "https://www.roblox.com/games/85535589075948/Anime-Reversal",
        color: "from-blue-500 to-cyan-500"
      },
      {
        name: "Jood Piece",
        placeId: "110029522258215",
        universeId: "9449667160",
        role: "Manager",
        discord: "https://discord.gg/joodpiece",
        roblox: "https://www.roblox.com/games/110029522258215/JOOD-PIECE",
        color: "from-amber-500 to-orange-500"
      },
      {
        name: "Godverse Awakening",
        placeId: "123669682680658",
        universeId: "8863236790",
        role: "Manager",
        discord: "https://discord.gg/2Exg5b3f46",
        roblox: "https://www.roblox.com/games/123669682680658/Godverse-Awakening",
        color: "from-emerald-500 to-teal-500"
      }
    ];

    async function fetchRealStats(universeId) {
      try {
        // ใช้ roproxy เพื่อข้าม CORS
        const res = await fetch(`https://games.roproxy.com/v1/games?universeIds=${universeId}`);
        const data = await res.json();
        const game = data.data[0];
        return {
          playing: game.playing || 0,
          visits: game.visits || 0,
          favorites: game.favoritedCount || 0
        };
      } catch (e) {
        console.log("API Error, using fallback");
        return { playing: 0, visits: 0, favorites: 0 };
      }
    }

    async function createReleaseCard(game) {
      const stats = await fetchRealStats(game.universeId);
      
      const card = document.createElement('div');
      card.className = `project-card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden`;
      card.innerHTML = `
        <div class="h-3 bg-gradient-to-r ${game.color}"></div>
        <div class="p-10">
          <h3 class="text-4xl font-bold mb-2">${game.name}</h3>
          <p class="text-indigo-400 mb-6">${game.role}</p>
          
          <div class="grid grid-cols-3 gap-6 mb-10 text-center">
            <div>
              <p class="text-emerald-400 text-sm font-medium">NOW PLAYING</p>
              <p class="text-4xl font-bold text-emerald-400">${stats.playing.toLocaleString()}</p>
            </div>
            <div>
              <p class="text-zinc-400 text-sm font-medium">FAVORITES</p>
              <p class="text-4xl font-bold">${stats.favorites.toLocaleString()}</p>
            </div>
            <div>
              <p class="text-zinc-400 text-sm font-medium">VISITS</p>
              <p class="text-4xl font-bold">${stats.visits.toLocaleString()}</p>
            </div>
          </div>

          <div class="mb-10">
            <canvas id="chart-${game.universeId}" class="w-full h-40"></canvas>
          </div>

          <div class="flex gap-4">
            <a href="${game.discord}" target="_blank" class="flex-1 py-5 border border-white/30 hover:border-white rounded-2xl text-center glow-btn">Discord</a>
            <a href="${game.roblox}" target="_blank" class="flex-1 py-5 bg-white text-black font-semibold rounded-2xl text-center glow-btn">PLAY NOW</a>
          </div>
        </div>
      `;
      return card;
    }

    // Render + Real-time Update
    async function renderGames() {
      const container = document.getElementById('release-grid');
      container.innerHTML = "";

      for (const game of games) {
        const card = await createReleaseCard(game);
        container.appendChild(card);

        // สร้างกราฟ (ข้อมูลจำลองแนวโน้ม)
        setTimeout(() => {
          const ctx = document.getElementById(`chart-${game.universeId}`);
          if (ctx) {
            new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['1h', '2h', '3h', '4h', '5h'],
                datasets: [{ label: 'Players', data: [120, 450, 320, 680, 520], borderColor: '#10b981', tension: 0.4 }]
              },
              options: { responsive: true, plugins: { legend: { display: false } } }
            });
          }
        }, 500);
      }
    }

    // โหลดข้อมูลเมื่อเปิดหน้า Release
    document.addEventListener('DOMContentLoaded', () => {
      // Render เมื่อกดไปที่ Release
      const releaseLink = document.querySelector('a[onclick="showSection(\'release\')"]');
      if (releaseLink) releaseLink.addEventListener('click', () => setTimeout(renderGames, 300));
    });

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Contact Form (เหมือนเดิม)
    document.getElementById('contact-form').addEventListener('submit', async (e) => { /* ... เหมือนเดิม ... */ });
  </script>
</body>
</html>
